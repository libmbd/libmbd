name: Preview Docs
# Per-PR documentation preview on Cloudflare Pages, for same-repo and fork PRs
# alike. Production docs stay on GitHub Pages (doc-deploy.yaml).
#
# Documentation builds the docs on `pull_request`, without secrets, and uploads
# them as the `docs` artifact. This workflow then runs in the base repository,
# where the secrets are available, and only deploys that artifact: it never
# checks out or executes anything from the PR, treats the artifact as untrusted
# static files, and puts nothing PR-controlled into a command line.
#
# Fork PRs deploy through the `doc-preview-fork` environment, which should have
# required reviewers so that a maintainer approves each fork preview.
#
# workflow_run always runs this file as it is on the default branch, so changes
# here take effect only once merged.
#
# Requires a Direct Upload Pages project named below and the repo secrets
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_run:
    workflows: [Documentation]
    types: [completed]
permissions: {}
jobs:
  resolve:
    name: Find PR
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'libmbd/libmbd' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      fork: ${{ steps.pr.outputs.fork }}
    steps:
      - id: pr
        uses: actions/github-script@v9
        with:
          script: |
            // workflow_run.pull_requests is empty for fork PRs, so look the PR
            // up by its head, and accept it only if its head is still the
            // commit these docs were built from.
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = prs.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open PR has head ${run.head_sha} - skipping`);
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('fork', String(pr.head.repo?.full_name !== `${owner}/${repo}`));
  deploy:
    name: Preview
    needs: resolve
    if: needs.resolve.outputs.number
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.fork == 'true' && 'doc-preview-fork' || 'doc-preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    concurrency:
      group: doc-preview-${{ needs.resolve.outputs.number }}
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: doc/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Keep the preview static
        # Cloudflare Pages runs a `_worker.js` (file or directory) found in the
        # upload as a Worker. The docs never contain one, so drop anything a PR
        # might have slipped in. There is no checkout, so no `functions/` or
        # wrangler config can come from the PR either.
        run: rm -rf doc/build/_worker.js doc/build/_routes.json
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # v3 defaults to the old wrangler 3.90.0, which fails deploying with
          # "Cannot convert argument to a ByteString"; pin a current wrangler.
          wranglerVersion: '4.112.0'
          command: pages deploy doc/build --project-name=libmbd-docs --branch=pr-${{ needs.resolve.outputs.number }}
      # Post (or update in place) a single PR comment with the preview links,
      # identified by an HTML-comment marker. Values are passed via env, not
      # string-interpolated into the script, to avoid any injection.
      - uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const body = [
              marker,
              `Documentation preview: ${process.env.ALIAS_URL}`,
              '',
              `Latest commit deploy: ${process.env.DEPLOY_URL}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
